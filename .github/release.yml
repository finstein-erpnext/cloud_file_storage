# Categories for GitHub's automatically generated release notes.
#
# NOTE ON SCOPE: releases on `version-15` and `version-16` are published by semantic-release
# (`create-release.yml` -> `@semantic-release/release-notes-generator`), which writes its own
# notes from the conventional commits and does NOT read this file. This configuration applies
# to notes generated by GitHub itself — the "Generate release notes" button on a manually
# drafted release, and the compare-notes GitHub offers on a tag. It is kept in sync with the
# commit types so both renderings group the same work the same way.
#
# The labels below are pull-request labels. `.github/labeler.yml` applies the area labels
# automatically; `breaking-change`, `security` and `skip-release-notes` are applied by hand.

changelog:
  exclude:
    labels:
      - skip-release-notes
      - inactive

  categories:
    - title: Breaking changes
      labels:
        - breaking-change

    - title: Security
      labels:
        - security

    - title: Features
      labels:
        - feat
        - feature-request

    - title: Fixes
      labels:
        - fix
        - bug

    - title: Performance
      labels:
        - perf

    - title: Migration and backup
      labels:
        - migration
        - backup

    - title: Documentation
      labels:
        - docs

    - title: Build, CI and dependencies
      labels:
        - ci
        - dependencies

    # Anything merged without one of the labels above still appears, rather than vanishing.
    - title: Other changes
      labels:
        - "*"
