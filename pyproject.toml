[project]
name = "cloud_file_storage"
authors = [
    { name = "ALYF GmbH", email = "hallo@alyf.de" },
    { name = "Finstein", email = "prabakaran.b@finstein.ai" },
]
description = "Enterprise cloud storage for Frappe attachments"
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = [
    # Imported directly by `cache/eviction.py`: the contention probe takes the same lockfile
    # `frappe.utils.synchronization.filelock` uses, but without its `log_error`-on-timeout
    # behaviour. frappe pins it too, so this is a transitive dependency being made explicit
    # rather than a new one — and it keeps the direct import honest if frappe ever drops it.
    "filelock>=3.12",
    "filetype>=1.2.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "s3transfer>=0.10.0",
    "six>=1.16.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
# Floor is v15.16.0: `find_file_by_url` and the `fid` query arg the serving layer
# depends on first exist there (docs/adr/amendments-register.md A34) -- verified still
# present on v16.
# Ceiling is <17: v16 is supported and exercised by its own CI leg. Note this table is
# ADVISORY, not enforcing -- bench's App.install() calls validate_app_dependencies() with
# throw=False (bench/app.py:244), so an out-of-range frappe warns and installs anyway.
# Only `bench validate-dependencies` exits non-zero.
frappe = ">=15.16.0,<16.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
